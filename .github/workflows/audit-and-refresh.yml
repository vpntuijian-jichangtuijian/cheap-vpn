name: Weekly Health Audit & Keep-Alive

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Data & Refresh Timestamp
        run: |
          python -c "
          import datetime, re
          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y--%m--%d')
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(r'Update-2026--2027%20Rolling', f'Update-{today}', content)
          if new_content == content:
              new_content = re.sub(r'Update-[\d\-]+', f'Update-{today}', content)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Auto-Commit Keep-Alive
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m 'chore(auto): weekly node health audit & rolling verification [skip ci]'
          git push
